document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

n  --samplia-grey-500: #666666;\n  --samplia-grey-600: #444444;\n  --samplia-grey-700: #2a2a2a;\n  --samplia-grey-900: #111111;\n\n  /* ----- Semantic color tokens ----- */\n  --primary:          var(--samplia-red-700);\n  --primary-hover:    #b32a3c;   /* −8% L from primary */\n  --primary-pressed:  #9c2433;\n  --primary-soft:     var(--samplia-red-100);\n  --accent:           var(--samplia-red-500);\n\n  --bg:               var(--samplia-white);\n  --bg-muted:         var(--samplia-grey-100);\n  --bg-inverse:       var(--samplia-black);\n\n  --fg1:              var(--samplia-black);       /* Headlines, primary copy */\n  --fg2:              var(--samplia-grey-600);    /* Body */\n  --fg3:              var(--samplia-grey-400);    /* Captions / meta */\n  --fg-on-primary:    var(--samplia-white);\n\n  --border:           var(--samplia-grey-200);\n  --border-strong:    var(--samplia-grey-300);\n  --divider:          var(--samplia-grey-100);\n\n  --success:          #2a8f5c;\n  --warning:          #d8a126;\n  --error:            var(--samplia-red-700);\n  --info:             #2c6fb3;\n\n  /* ----- Type families ----- */\n  --font-display: \"Raleway\", \"Helvetica Neue\", Arial, sans-serif;\n  --font-body:    \"Raleway\", \"Helvetica Neue\", Arial, sans-serif;\n  --font-ui:      \"Inter\", \"Raleway\", \"Helvetica Neue\", Arial, sans-serif; /* Myriad Pro substitute */\n\n  /* ----- Type scale (1.250 Major Third) ----- */\n  --fs-12: 0.75rem;\n  --fs-14: 0.875rem;\n  --fs-16: 1rem;\n  --fs-18: 1.125rem;\n  --fs-20: 1.25rem;\n  --fs-24: 1.5rem;\n  --fs-30: 1.875rem;\n  --fs-36: 2.25rem;\n  --fs-48: 3rem;\n  --fs-60: 3.75rem;\n  --fs-72: 4.5rem;\n\n  /* ----- Line heights ----- */\n  --lh-tight: 1.05;\n  --lh-snug:  1.2;\n  --lh-base:  1.5;\n  --lh-loose: 1.7;\n\n  /* ----- Letter spacing ----- */\n  --tracking-tight: -0.02em;\n  --tracking-snug:  -0.01em;\n  --tracking-normal: 0;\n  --tracking-wide:  0.04em;\n  --tracking-display: 0.08em;   /* For uppercase display lockups */\n\n  /* ----- Weights ----- */\n  --w-extralight: 200;\n  --w-light:      300;\n  --w-regular:    400;\n  --w-medium:     500;\n  --w-semibold:   600;\n  --w-bold:       700;\n  --w-black:      900;\n\n  /* ----- Spacing scale (4-pt base) ----- */\n  --space-0:  0;\n  --space-1:  4px;\n  --space-2:  8px;\n  --space-3:  12px;\n  --space-4:  16px;\n  --space-5:  20px;\n  --space-6:  24px;\n  --space-8:  32px;\n  --space-10: 40px;\n  --space-12: 48px;\n  --space-16: 64px;\n  --space-20: 80px;\n  --space-24: 96px;\n\n  /* ----- Radii ----- */\n  --r-none: 0;\n  --r-xs:   2px;\n  --r-sm:   4px;\n  --r-md:   8px;\n  --r-lg:   12px;\n  --r-xl:   20px;\n  --r-2xl:  28px;\n  --r-pill: 999px;\n\n  /* ----- Elevation / shadows ----- */\n  --shadow-xs: 0 1px 2px rgba(15,15,15,0.06);\n  --shadow-sm: 0 2px 6px rgba(15,15,15,0.06), 0 1px 2px rgba(15,15,15,0.04);\n  --shadow-md: 0 6px 16px rgba(15,15,15,0.08), 0 2px 4px rgba(15,15,15,0.04);\n  --shadow-lg: 0 16px 40px rgba(15,15,15,0.10), 0 4px 8px rgba(15,15,15,0.04);\n  --shadow-brand: 0 12px 28px rgba(199,51,70,0.22);\n\n  /* ----- Motion ----- */\n  --ease-out:  cubic-bezier(0.22, 1, 0.36, 1);\n  --ease-in:   cubic-bezier(0.55, 0, 1, 0.45);\n  --ease-std:  cubic-bezier(0.4, 0, 0.2, 1);\n  --dur-fast:   120ms;\n  --dur-base:   220ms;\n  --dur-slow:   400ms;\n\n  /* ----- Layout ----- */\n  --maxw-prose: 68ch;\n  --maxw-page:  1240px;\n  --gutter:     24px;\n}\n\n/* =========================================================================\n   Semantic type roles — apply to elements directly.\n   ========================================================================= */\n\n.s-display {\n  font-family: var(--font-display);\n  font-weight: var(--w-black);\n  font-size: clamp(2.5rem, 6vw, var(--fs-72));\n  line-height: var(--lh-tight);\n  letter-spacing: var(--tracking-tight);\n  color: var(--fg1);\n}\n\n.s-h1, h1.s {\n  font-family: var(--font-display);\n  font-weight: var(--w-bold);\n  font-size: clamp(2rem, 4vw, var(--fs-48));\n  line-height: var(--lh-snug);\n  letter-spacing: var(--tracking-snug);\n  color: var(--fg1);\n}\n\n.s-h2, h2.s {\n  font-family: var(--font-display);\n  font-weight: var(--w-bold);\n  font-size: var(--fs-30);\n  line-height: var(--lh-snug);\n  letter-spacing: var(--tracking-snug);\n  color: var(--fg1);\n}\n\n.s-h3, h3.s {\n  font-family: var(--font-display);\n  font-weight: var(--w-semibold);\n  font-size: var(--fs-20);\n  line-height: 1.3;\n  color: var(--fg1);\n}\n\n.s-eyebrow {\n  font-family: var(--font-display);\n  font-weight: var(--w-bold);\n  font-size: var(--fs-12);\n  letter-spacing: var(--tracking-display);\n  text-transform: uppercase;\n  color: var(--primary);\n}\n\n.s-lead {\n  font-family: var(--font-body);\n  font-weight: var(--w-regular);\n  font-size: var(--fs-20);\n  line-height: var(--lh-loose);\n  color: var(--fg2);\n}\n\n.s-body, p.s {\n  font-family: var(--font-body);\n  font-weight: var(--w-regular);\n  font-size: var(--fs-16);\n  line-height: var(--lh-base);\n  color: var(--fg2);\n}\n\n.s-caption {\n  font-family: var(--font-body);\n  font-weight: var(--w-medium);\n  font-size: var(--fs-12);\n  letter-spacing: var(--tracking-wide);\n  color: var(--fg3);\n}\n\n.s-claim {                /* Brand claim lockup: \"Turning tryers into buyers.\" */\n  font-family: var(--font-display);\n  font-weight: var(--w-light);\n  font-style: italic;\n  font-size: var(--fs-18);\n  letter-spacing: var(--tracking-snug);\n  color: var(--fg1);\n}\n\n.s-mono {\n  font-family: ui-monospace, \"SFMono-Regular\", Menlo, Consolas, monospace;\n  font-size: var(--fs-14);\n  color: var(--fg1);\n}\n<\u002Fstyle>\n<script src=\"6e048f74-cfa2-4f5f-9056-fb12173ca63f\"><\u002Fscript>\n<style>\ndoc-page:not(:defined){visibility:hidden}\nbody{margin:0;font-family:'Raleway',system-ui,sans-serif;color:#1a1a1a}\na{color:#C73346;text-decoration:none;border-bottom:1px solid rgba(199,51,70,.35)}\na:hover{color:#B32A3C;border-bottom-color:#B32A3C}\n<\u002Fstyle>\n<\u002Fhelmet>\n<doc-page margin=\"0.85in\">\n<header style=\"display:flex;flex-direction:column;gap:14px;padding-bottom:22px;border-bottom:2px solid #000000;margin-bottom:34px\">\n<div style=\"font-family:'Raleway',sans-serif;font-size:11px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:#999999\">Bases legales<\u002Fdiv>\n<h1 style=\"margin:0;font-family:'Raleway',sans-serif;font-size:30px;line-height:1.2;font-weight:700;letter-spacing:-0.02em;color:#000000;text-wrap:balance\">BASES DE LA PROMOCIÓN – “Reto Bang”<\u002Fh1>\n<\u002Fheader>\n\n<p style=\"margin:0 0 34px;font-size:14.5px;line-height:1.65;text-align:justify;text-wrap:pretty\">VEH Hibiscus Spain, S.L.U., en adelante “Vestacy”, domiciliada en Paseo de Gracia número 9, 08007 Barcelona con CIF B48001770, inscrita en el Registro Mercantil de Barcelona, como entidad organizadora y titular de la marca Cillit Bang, realizará una promoción denominada “Reto Bang” con la finalidad de promocionar su marca dentro del Estado español, que tendrá lugar del 15 de septiembre al 15 de noviembre de 2026, en las condiciones detalladas en las cláusulas de las presentes bases legales.<\u002Fp>\n\n<section style=\"margin-bottom:30px\">\n<h2 style=\"margin:0 0 12px;font-family:'Raleway',sans-serif;font-size:15px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:#000000\">1. Período promocional<\u002Fh2>\n<p style=\"margin:0;font-size:14.5px;line-height:1.65;text-align:justify;text-wrap:pretty\">El período promocional es del 15 de septiembre al 15 de noviembre de 2026.<\u002Fp>\n<\u002Fsection>\n\n<section style=\"margin-bottom:30px\">\n<h2 style=\"margin:0 0 12px;font-family:'Raleway',sans-serif;font-size:15px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:#000000\">2. Ámbito territorial y edad mínima<\u002Fh2>\n<p style=\"margin:0;font-size:14.5px;line-height:1.65;text-align:justify;text-wrap:pretty\">La Promoción está dirigida a todos los consumidores, personas físicas, mayores de 18 años y residentes legales en España, quedando excluidos los residentes en Ceuta y Melilla.<\u002Fp>\n<\u002Fsection>\n\n<section style=\"margin-bottom:30px\">\n<h2 style=\"margin:0 0 12px;font-family:'Raleway',sans-serif;font-size:15px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:#000000\">3. Establecimientos adheridos<\u002Fh2>\n<p style=\"margin:0;font-size:14.5px;line-height:1.65;text-align:justify;text-wrap:pretty\">Los productos promocionales podrán adquirirse en cualquier punto de venta físico u online situado en España, siempre que se trate de establecimientos que comercialicen los productos promocionales incluidos en estas Bases.<\u002Fp>\n<\u002Fsection>\n\n<section style=\"margin-bottom:30px\">\n<h2 style=\"margin:0 0 12px;font-family:'Raleway',sans-serif;font-size:15px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:#000000\">4. Producto promocional<\u002Fh2>\n<p style=\"margin:0 0 14px;font-size:14.5px;line-height:1.65;text-align:justify;text-wrap:pretty\">Están incluidos en la promoción los siguientes productos de la marca Cillit Bang:<\u002Fp>\n<sc-raw-table style=\"width:100%;border-collapse:collapse;font-size:13.5px\">\n<sc-raw-thead>\n<sc-raw-tr>\n<sc-raw-th style=\"text-align:left;padding:10px 12px;background:#F2F2F2;border-bottom:1.5px solid #000000;font-weight:700;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#000000\">Producto<\u002Fsc-raw-th>\n<sc-raw-th style=\"text-align:right;padding:10px 12px;background:#F2F2F2;border-bottom:1.5px solid #000000;font-weight:700;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#000000\">Código E.A.N.<\u002Fsc-raw-th>\n<\u002Fsc-raw-tr>\n<\u002Fsc-raw-thead>\n<sc-raw-tbody>\n<sc-raw-tr style=\"break-inside:avoid\">\n<sc-raw-td style=\"padding:9px 12px;border-bottom:1px solid #E6E6E6;font-weight:500\">CILLIT BANG SUC. HUM. 750ML(12<\u002Fsc-raw-td>\n<sc-raw-td style=\"padding:9px 12px;border-bottom:1px solid #E6E6E6;text-align:right;font-variant-numeric:tabular-nums;color:#666666\">8410104883157<\u002Fsc-raw-td>\n<\u002Fsc-raw-tr>\n<sc-raw-tr style=\"break-inside:avoid\">\n<sc-raw-td style=\"padding:9px 12px;border-bottom:1px solid #E6E6E6;font-weight:500\">CILLIT BANG QUITAGRASAS 750ML(12<\u002Fsc-raw-td>\n<sc-raw-td style=\"padding:9px 12px;border-bottom:1px solid #E6E6E6;text-align:right;font-variant-numeric:tabular-nums;color:#666666\">8410104004415<\u002Fsc-raw-td>\n<\u002Fsc-raw-tr>\n<sc-raw-tr style=\"break-inside:avoid\">\n<sc-raw-td style=\"padding:9px 12px;border-bottom:1px solid #E6E6E6;font-weight:500\">CILLIT BANG PASTA<\u002Fsc-raw-td>\n<sc-raw-td style=\"padding:9px 12px;border-bottom:1px solid #E6E6E6;text-align:right;font-variant-numeric:tabular-nums;color:#666666\">8410104922849<\u002Fsc-raw-td>\n<\u002Fsc-raw-tr>\n<sc-raw-tr style=\"break-inside:avoid\">\n<sc-raw-td style=\"padding:9px 12px;border-bottom:1px solid #E6E6E6;font-weight:500\">CILLIT BANG CAL &amp; SUC 750ML(12<\u002Fsc-raw-td>\n<sc-raw-td style=\"padding:9px 12px;border-bottom:1px solid #E6E6E6;text-align:right;font-variant-numeric:tabular-nums;color:#666666\">8410104926403<\u002Fsc-raw-td>\n<\u002Fsc-raw-tr>\n<\u002Fsc-raw-tbody>\n<\u002Fsc-raw-table>\n<\u002Fsection>\n\n<section style=\"margin-bottom:30px\">\n<h2 style=\"margin:0 0 12px;font-family:'Raleway',sans-serif;font-size:15px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:#000000\">5. El premio<\u002Fh2>\n<p style=\"margin:0 0 12px;font-size:14.5px;line-height:1.65;text-align:justify;text-wrap:pretty\">Está limitado a un (1) premio por persona y ticket de compra.<\u002Fp>\n<p style=\"margin:0 0 12px;font-size:14.5px;line-height:1.65;text-align:justify;text-wrap:pretty\">Hay un total de 150 premios, distribuidos de la siguiente forma:<\u002Fp>\n<ul style=\"margin:0 0 14px;padding-left:22px;display:flex;flex-direction:column;gap:8px;list-style-type:disc\">\n<li style=\"font-size:14.5px;line-height:1.6;text-align:justify\">100 premios consistentes en una tarjeta regalo valorada en 20 €, a sortear entre quienes adquieran un (1) producto Cillit Bang en un mismo ticket de compra.<\u002Fli>\n<li style=\"font-size:14.5px;line-height:1.6;text-align:justify\">40 premios a sortear entre quienes adquieran dos (2) productos Cillit Bang en un mismo ticket de compra. Cada ganador podrá elegir entre:\n<ul style=\"margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:5px;list-style-type:circle\">\n<li style=\"font-size:14.5px;line-height:1.6\">una tarjeta regalo valorada en 30 €, o<\u002Fli>\n<li style=\"font-size:14.5px;line-height:1.6\">un lote de productos Cillit Bang.<\u002Fli>\n<\u002Ful>\n<\u002Fli>\n<li style=\"font-size:14.5px;line-height:1.6;text-align:justify\">10 premios a sortear entre quienes adquieran al menos tres (3) productos Cillit Bang en un mismo ticket de compra. Cada ganador podrá elegir entre:\n<ul style=\"margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:5px;list-style-type:circle\">\n<li style=\"font-size:14.5px;line-height:1.6\">una tarjeta regalo valorada en 100 €, o<\u002Fli>\n<li style=\"font-size:14.5px;line-height:1.6\">una limpieza a domicilio valorada en 100 €.<\u002Fli>\n<\u002Ful>\n<\u002Fli>\n<\u002Ful>\n<p style=\"margin:0 0 12px;font-size:14.5px;line-height:1.65;text-align:justify;text-wrap:pretty\">En caso de que la compra se haya realizado en Carrefour, El Corte Inglés o Amazon, el premio consistirá en una (1) tarjeta regalo del correspondiente distribuidor.<\u002Fp>\n<p style=\"margin:0 0 12px;font-size:14.5px;line-height:1.65;text-align:justify;text-wrap:pretty\">Para las compras realizadas en el resto de establecimientos, el importe equivalente será abonado mediante transferencia bancaria.<\u002Fp>\n<p style=\"margin:0 0 12px;font-size:14.5px;line-height:1.65;text-align:justify;text-wrap:pretty\">La tarjeta regalo será emitida conforme a las condiciones de uso establecidas por el distribuidor correspondiente. La Organización no será responsable de las limitaciones, caducidad, condiciones de utilización o incidencias derivadas del uso de dichas tarjetas, que se regirán por las condiciones del propio emisor.<\u002Fp>\n<p style=\"margin:0 0 12px;font-size:14.5px;line-height:1.65;text-align:justify;text-wrap:pretty\">La limpieza a domicilio será prestada por un proveedor designado por la Organización, en función de la disponibilidad geográfica y de cobertura del servicio.<\u002Fp>\n<p style=\"margin:0 0 12px;font-size:14.5px;line-height:1.65;text-align:justify;text-wrap:pretty\">En caso de que el servicio no pueda prestarse en la localidad de residencia del ganador por causas ajenas a la Organización o por inexistencia de cobertura del proveedor, el ganador recibirá, en sustitución de dicho premio, una tarjeta regalo por importe de 100 €, sin que pueda exigir ninguna otra compensación.<\u002Fp>\n<p style=\"margin:0;font-size:14.5px;line-height:1.65;text-align:justify;text-wrap:pretty\">Vestacy quedará eximida de toda obligación o compensación a los participantes si, por causa de fuerza mayor, imperativo legal o cualquier otra causa no imputable a Vestacy, la promoción fuera suspendida o anulada, total o parcialmente. En tal caso, dicha circunstancia será comunicada debidamente a los participantes afectado<\u002Fp>\n<\u002Fsection>\n\n<section style=\"margin-bottom:30px\">\n<h2 style=\"margin:0 0 12px;font-family:'Raleway',sans-serif;font-size:15px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:#000000\">6. Mecánica de la promoción<\u002Fh2>\n<p style=\"margin:0 0 12px;font-size:14.5px;line-height:1.65;text-align:justify;text-wrap:pretty\">Las personas que deseen participar deberán comprar al menos uno (1), dos (2) ó tres (3) productos Cillit Bang en alguno de los puntos de venta adheridos a la promoción.<\u002Fp>\n<p style=\"margin:0 0 12px;font-size:14.5px;line-height:1.65;text-align:justify;text-wrap:pretty\">Entrar a la web <a href=\"https://retobang.es\">https://retobang.es<\u002Fa> donde encontrará un formulario de participación. Deberá rellenarlo con todos los datos que se solicitan: nombre completo, e-mail, establecimiento de compra, producto/s comprado/s, comunidad autónoma de residencia y subir la imagen del ticket de compra. En el caso de compras realizadas online, la factura, justificante de compra o documento equivalente emitido por el vendedor.<\u002Fp>\n<p style=\"margin:0 0 12px;font-size:14.5px;line-height:1.65;text-align:justify;text-wrap:pretty\">Después tiene que marcar las casillas de la aceptación de las bases legales, y por último, se hace el click en el botón de “Participar” para registrar la participación.<\u002Fp>\n<p style=\"margin:0 0 12px;font-size:14.5px;line-height:1.65;text-align:justify;text-wrap:pretty\">Para ser considerado ganador deberá conservar el ticket de compra original. Las imágenes deben tener el formato .jpg, .png o .pdf y no superar 2 MB.<\u002Fp>\n<p style=\"margin:0 0 12px;font-size:14.5px;line-height:1.65;text-align:justify;text-wrap:pretty\">El ticket de compra o factura tiene que salir completo y visualizarse bien en la imagen. En el caso de pedidos online, no se admitirán recortes de capturas de pantalla del pedido realizado.<\u002Fp>\n<p style=\"margin:0 0 12px;font-size:14.5px;line-height:1.65;text-align:justify;text-wrap:pretty\">El ticket de compra deberá ser anterior en fecha y hora en que el consumidor participe en la promoción y deberá estar dentro de las fechas de la promoción indicadas en el punto 1 de estas bases.<\u002Fp>\n<p style=\"margin:0 0 12px;font-size:14.5px;line-height:1.65;text-align:justify;text-wrap:pretty\">No se admitirán tickets tachados, manipulados o rotos.<\u002Fp>\n<p style=\"margin:0 0 12px;font-size:14.5px;line-height:1.65;text-align:justify;text-wrap:pretty\">En las compras realizadas a través de Internet deberán aportarse documentos que permitan verificar de forma inequívoca la compra realizada, el establecimiento vendedor, la fecha, los productos adquiridos y el importe abonado. No serán válidas simples capturas de pantalla del carrito de compra, del proceso de pago o del pedido en curso.<\u002Fp>\n<p style=\"margin:0 0 12px;font-size:14.5px;line-height:1.65;text-align:justify;text-wrap:pretty\">No hay límite de participaciones por usuario, pero solo se permitirá una participación por ticket de compra.<\u002Fp>\n<p style=\"margin:0 0 12px;font-size:14.5px;line-height:1.65;text-align:justify;text-wrap:pretty\">Si se detecta que una persona participa más de una vez con un mismo ticket, este participante quedará fuera de la promoción y su exclusión implicará que NO sean válidas ninguna de sus participaciones, aunque sea con tickets de compra diferentes.<\u002Fp>\n<p style=\"margin:0 0 12px;font-size:14.5px;line-height:1.65;text-align:justify;text-wrap:pretty\">En el caso de que varias personas participen en la promoción con el mismo ticket, cada una de estas personas quedará excluida de la promoción y ninguna de sus posibles participaciones con otros tickets de compra serán consideradas como válidas.<\u002Fp>\n<p style=\"margin:0 0 12px;font-size:14.5px;line-height:1.65;text-align:justify;text-wrap:pretty\">En el caso de que se detecte actividad sospechosa, fraudulenta o inadecuada, Vestacy se reserva el derecho a solicitar al participante las comprobaciones que considere oportunas con el fin de validar el registro.<\u002Fp>\n<p style=\"margin:0 0 12px;font-size:14.5px;line-height:1.65;text-align:justify;text-wrap:pretty\">En el caso de que la participación del premiado resulte inválida por no cumplir con alguno de los requisitos de la promoción, el premio pasará al siguiente participante.<\u002Fp>\n<p style=\"margin:0 0 12px;font-size:14.5px;line-height:1.65;text-align:justify;text-wrap:pretty\">Una vez finalizado el período promocional, el viernes 20 de noviembre de 2026 se realizarán tres (3) sorteos independientes mediante la plataforma AppSorteos, uno por cada nivel de participación previsto en estas Bases:<\u002Fp>\n<ul style=\"margin:0 0 12px;padding-left:22px;display:flex;flex-direction:column;gap:6px;list-style-type:disc\">\n<li style=\"font-size:14.5px;line-height:1.6;text-align:justify\">Sorteo Nivel 1: entre todos los participantes que hayan adquirido un (1) producto Cillit Bang en un mismo ticket de compra.<\u002Fli>\n<li style=\"font-size:14.5px;line-height:1.6;text-align:justify\">Sorteo Nivel 2: entre todos los participantes que hayan adquirido dos (2) productos Cillit Bang en un mismo ticket de compra.<\u002Fli>\n<li style=\"font-size:14.5px;line-height:1.6;text-align:justify\">Sorteo Nivel 3: entre todos los participantes que hayan adquirido al menos tres (3) productos Cillit Bang en un mismo ticket de compra.<\u002Fli>\n<\u002Ful>\n<p style=\"margin:0;font-size:14.5px;line-height:1.65;text-align:justify;text-wrap:pretty\">Cada participación se incluirá exclusivamente en el sorteo correspondiente al número de productos adquiridos reflejado en el ticket de compra, no pudiendo participar simultáneamente en más de un nivel con un mismo ticket.<\u002Fp>\n<\u002Fsection>\n\n<section style=\"margin-bottom:30px\">\n<h2 style=\"margin:0 0 12px;font-family:'Raleway',sans-serif;font-size:15px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:#000000\">7. Comunicación con el ganador y entrega de premio<\u002Fh2>\n<p style=\"margin:0 0 12px;font-size:14.5px;line-height:1.65;text-align:justify;text-wrap:pretty\">El participante deberá proporcionar datos de contacto veraces, actualizados y funcionales.<\u002Fp>\n<p style=\"margin:0 0 12px;font-size:14.5px;line-height:1.65;text-align:justify;text-wrap:pretty\">La comunicación con los ganadores se realizará por correo electrónico en los diez (10) días hábiles siguientes a la celebración del sorteo. Samplia contactará con cada ganador para verificar la aceptación del premio y facilitar un formulario de aceptación.<\u002Fp>\n<p style=\"margin:0 0 12px;font-size:14.5px;line-height:1.65;text-align:justify;text-wrap:pretty\">En dicho formulario, el ganador indicará el premio elegido, en función del número de productos adquiridos:<\u002Fp>\n<ul style=\"margin:0 0 12px;padding-left:22px;display:flex;flex-direction:column;gap:6px;list-style-type:disc\">\n<li style=\"font-size:14.5px;line-height:1.6;text-align:justify\">Compra de 1 producto: participará por una tarjeta regalo de 20 €.<\u002Fli>\n<li style=\"font-size:14.5px;line-height:1.6;text-align:justify\">Compra de 2 productos: podrá elegir entre una tarjeta regalo de 30 € o un lote de productos Cillit Bang.<\u002Fli>\n<li style=\"font-size:14.5px;line-height:1.6;text-align:justify\">Compra de 3 ó más productos: podrá elegir entre una tarjeta regalo de 100 € o una limpieza a domicilio valorada en 100 €.<\u002Fli>\n<\u002Ful>\n<p style=\"margin:0 0 12px;font-size:14.5px;line-height:1.65;text-align:justify;text-wrap:pretty\">En caso de optar por una tarjeta regalo, si la compra se realizó en Carrefour, El Corte Inglés o Amazon, el ganador recibirá la tarjeta regalo correspondiente a dicho establecimiento. Para el resto de establecimientos adheridos, el importe equivalente será abonado mediante transferencia bancaria.<\u002Fp>\n<p style=\"margin:0 0 12px;font-size:14.5px;line-height:1.65;text-align:justify;text-wrap:pretty\">Los ganadores que elijan un lote de productos deberán facilitar los datos necesarios para su envío y aceptar expresamente la cesión de dichos datos a VEH Hibiscus Spain, S.L.U. con la única finalidad de gestionar la entrega del premio.<\u002Fp>\n<p style=\"margin:0;font-size:14.5px;line-height:1.65;text-align:justify;text-wrap:pretty\">En caso de que no resulte posible contactar con un ganador o este no acepte el premio dentro del plazo establecido en estas Bases, perderá su derecho al mismo y el premio será adjudicado al siguiente participante suplente, siguiendo el orden establecido en el sorteo.<\u002Fp>\n<\u002Fsection>\n\n<section style=\"margin-bottom:30px\">\n<h2 style=\"margin:0 0 16px;font-family:'Raleway',sans-serif;font-size:15px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:#000000\">8. Otras consideraciones aplicables a la promoción<\u002Fh2>\n\n<h3 style=\"margin:0 0 8px;font-family:'Raleway',sans-serif;font-size:14px;font-weight:700;color:#000000\">Datos personales<\u002Fh3>\n<p style=\"margin:0 0 16px;font-size:14.5px;line-height:1.65;text-align:justify;text-wrap:pretty\">En cumplimiento de lo dispuesto en el Reglamento (UE) 2016/679 del Parlamento Europeo y del Consejo, de 27 de abril de 2016, relativo a la protección de las personas físicas en lo que respecta al tratamiento de datos personales y a la libre circulación de estos datos (RGPD), tal y como se recoge en detalle en el Aviso de Privacidad, Vestacy como responsable del tratamiento, informa a los participantes que los datos personales que voluntariamente faciliten a Vestacy serán tratados de conformidad con lo dispuesto en la presente cláusula. Los datos personales que recabaremos son nombre completo, e-mail, número de teléfono, nombre del establecimiento donde ha adquirido el producto, dirección completa, imagen del ticket de compra y fotocopia del DNI/NIE. Sus datos personales necesarios se recopilan para organizar la promoción (la base legal es la ejecución de un contrato). Los datos serán eliminados 3 meses después del envío de los premios. El ganador garantiza que los datos personales facilitados a Vestacy, a efectos de esta promoción, son ciertos, completos y exactos, y se hace responsable de comunicar a Vestacy cualquier modificación de estos. En este sentido, Vestacy no se hace responsable de la imposibilidad de tramitar la reclamación del premio de esta promoción, en el caso de que los datos facilitados no estén actualizados, no sean veraces ni correctos. Le recordamos que en cualquier momento puede ejercer sus derechos de acceso, rectificación, cancelación, oposición y limitación del tratamiento, así como otros derechos contemplados en la legislación aplicable, dirigiéndose a VEH Hibiscus Spain, S.L.U., en Paseo de Gracia número 9, 08007 Barcelona con CIF B48001770 o por correo electrónico a <a href=\"mailto:dpo@samplia.com\">dpo@samplia.com<\u002Fa>. Asimismo, puede dirigirse a la Agencia Española de Protección de Datos, para cualquier duda o reclamación al respecto.<\u002Fp>\n\n<h3 style=\"margin:0 0 8px;font-family:'Raleway',sans-serif;font-size:14px;font-weight:700;color:#000000\">Derechos de Imagen<\u002Fh3>\n<p style=\"margin:0 0 16px;font-size:14.5px;line-height:1.65;text-align:justify;text-wrap:pretty\">De conformidad con la Ley 1/1982 de protección civil del, derecho al honor, a la intimidad personal y familiar y a la propia imagen, el premiado cede a Vestacy los derechos sobre nombre, apellidos, dirección e imagen en cualquier actividad publicitaria y/o promocional que esté relacionada con esta promoción y, en especial, con el disfrute de los premios que se deriven de su participación en esta promoción a través de cualquier medio de reproducción tanto electrónico (internet, cd, y otros análogos) como convencional (papel, fotografías y otros análogos), en cualquier medio o sistema técnico o tecnológico existente en la actualidad o que se encuentre en fase de investigación y desarrollo (incluyendo a título de ejemplo sin carácter limitativo la explotación de internet, la explotación televisiva en cualquier forma) sin que dichas actividades les confieran derecho de remuneración o beneficio alguno con excepción hecha de la entrega del premio ganado conforme a estas Bases. El premiado cede gratuitamente a Vestacy los derechos de imagen que pudieran corresponderles como consecuencia de la emisión y/o grabación audiovisual, así como los reportajes gráficos, individual o colectivos que se realice y autorizan de forma expresa e irrevocable a Vestacy a conservar las mencionadas grabaciones e imágenes gráficas para ser utilizadas total o parcialmente con fines publicitarios o promocionales en los medios que considere conveniente o en cualquier dominio en Internet de Vestacy, o redes de las que forme parte.<\u002Fp>\n\n<h3 style=\"margin:0 0 8px;font-family:'Raleway',sans-serif;font-size:14px;font-weight:700;color:#000000\">Retención fiscal<\u002Fh3>\n<p style=\"margin:0 0 16px;font-size:14.5px;line-height:1.65;text-align:justify;text-wrap:pretty\">A los premios de la presente Promoción, les serán de aplicación la Ley 35/2006 de 28 de noviembre del Impuesto sobre la Renta de las Personas Físicas (LIRPF); el Real Decreto 439/2007, de 30 de marzo, por el que se aprueba el Reglamento de Impuesto de la Renta de las Personas Físicas (RIRPF); el Real Decreto 1614/2011, de 14 de noviembre, por el que se desarrolla la Ley 13/2011, de 27 de mayo, de regulación del juego, en lo relativo a licencias, autorizaciones y registros del juego, por lo que en su caso, corresponderá a la entidad Vestacy la realización del ingreso a cuenta o la práctica de la retención procedente. De conformidad con la normativa mencionada, los premios concedidos por la participación en juegos, concursos, rifas, o combinaciones alternativas vinculadas a la venta o promoción de bienes o servicios están sujetos a retención o ingreso a cuenta siempre que el valor del premio sea superior a 300 euros.<\u002Fp>\n\n<h3 style=\"margin:0 0 8px;font-family:'Raleway',sans-serif;font-size:14px;font-weight:700;color:#000000\">Exclusiones<\u002Fh3>\n<p style=\"margin:0 0 16px;font-size:14.5px;line-height:1.65;text-align:justify;text-wrap:pretty\">Quedan expresamente excluidos de la participación en esta promoción todos los empleados y sus familiares hasta segundo grado de parentesco de Vestacy, empresas intervinientes en la realización de la promoción y todas aquellas en las que se comercialicen productos de Vestacy. Si alguna persona dejara de ser empleado de las citadas entidades durante el periodo promocional, bajo ningún concepto podrá reclamar el premio en caso de participar. Derecho de eliminación de participaciones fraudulentas Vestacy se reserva el derecho de eliminar justificadamente a cualquier usuario que defraude, altere o inutilice el buen funcionamiento y el transcurso normal y reglamentario de la presente promoción y para ello se reserva el derecho de pedir el DNI/NIE a cualquier participante en la promoción.<\u002Fp>\n\n<h3 style=\"margin:0 0 8px;font-family:'Raleway',sans-serif;font-size:14px;font-weight:700;color:#000000\">Aceptación de las bases<\u002Fh3>\n<p style=\"margin:0;font-size:14.5px;line-height:1.65;text-align:justify;text-wrap:pretty\">Se informa a los posibles participantes que el simple hecho de participar en esta promoción implica la total aceptación de las presentes bases. En caso de suscitarse problemas o incidencias en la interpretación de las presentes bases o en el desarrollo de la promoción, se instará a los criterios que aplique Vestacy. Las presentes Bases Legales se regirán por la legislación española. Cualquier controversia que pudiera derivarse de la interpretación, ejecución o cumplimiento de las presentes Bases será resuelta por los Juzgados y Tribunales que resulten competentes conforme a la normativa aplicable.<\u002Fp>\n<\u002Fsection>\n\n<section>\n<h2 style=\"margin:0 0 12px;font-family:'Raleway',sans-serif;font-size:15px;font-weight:700;letter-spacing:.02em;text-transform:uppercase;color:#000000\">9. Otros<\u002Fh2>\n<p style=\"margin:0;font-size:14.5px;line-height:1.65;text-align:justify;text-wrap:pretty\">Vestacy se reserva el derecho a realizar modificaciones o añadir anexos sobre las presentes bases en relación con su mecánica y premios, siempre que las mismas estén justificadas o no perjudiquen a los participantes, se realicen dentro del período de vigencia de la promoción, y se comuniquen a éstos debidamente. Vestacy no se hace responsable por la imposibilidad de registrar algún participante debido a un error en la captura de sus datos personales como consecuencia de la facilitación de datos incompletos o erróneos. Vestacy y la agencia de publicidad que gestiona la realización de la promoción no se hacen responsables de las incidencias y sucesos de todo orden (por ejemplo, imposibilidad de registrar los datos de algún participante, etc.) que sean provocadas por una deficiente prestación del servicio por parte de las compañías de correos y/o mensajería.<\u002Fp>\n<\u002Fsection>\n<\u002Fdoc-page>\n<\u002Fx-dc>\n\n\n<\u002Fbody><\u002Fhtml>"
